[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jquants-return-ranking"
version = "0.1.0"
description = "Show top Japanese stock one-year return rankings from J-Quants v2 data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jquants-return-ranking contributors" }]
dependencies = ["platformdirs>=4.0"]
keywords = ["jquants", "stocks", "ranking", "japan", "returns"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
jrr = "jquants_return_ranking.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jquants_return_ranking"]

